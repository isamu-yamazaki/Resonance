name: Build for production

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  generate-server-version:
    runs-on: ubuntu-latest
    outputs:
      server_version: ${{ steps.generate_version.outputs.server_version }}
    steps:
      - name: Generate shared build ID
        id: generate_version
        run: echo "server_version=$(uuidgen)" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          elif git log --since="24 hours ago" --oneline | grep -q .; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  download-lfs:
    needs: check
    if: needs.check.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure LFS credentials
        run: |
          git config --global credential.helper store
          echo "https://${{ secrets.LFS_USERNAME }}:${{ secrets.LFS_PASSWORD }}@${{ vars.LFS_HOST }}" >> ~/.git-credentials

      - name: Restore LFS cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: lfs-${{ github.sha }}
          restore-keys: |
            lfs-

      - name: Pull LFS files
        run: git lfs pull

      - name: Save LFS cache
        uses: actions/cache/save@v4
        with:
          path: .git/lfs
          key: lfs-${{ github.sha }}

  build:
    needs: [ check, download-lfs, generate-server-version ]
    if: needs.check.outputs.has_changes == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - target: win64
            mode: Client
            client_config: ProductionClient
          - target: osxuniversal
            mode: Client
            client_config: ProductionClient
          - target: linux64
            mode: Server
            client_config: Default
    steps:
      - uses: actions/checkout@v4

      - name: Configure LFS credentials
        run: |
          git config --global credential.helper store
          echo "https://${{ secrets.LFS_USERNAME }}:${{ secrets.LFS_PASSWORD }}@${{ vars.LFS_HOST }}" >> ~/.git-credentials

      - name: Restore LFS cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: lfs-${{ github.sha }}
          restore-keys: |
            lfs-

      - name: Pull LFS files
        run: git lfs pull

      - name: Install Unity
        if: steps.cache-unity.outputs.cache-hit != 'true'
        run: |
          gh cache delete "unity-${{ vars.UNITY_VERSION }}" --repo ${{ github.repository }} || true
          gh cache delete "unity-${{ vars.UNITY_VERSION }}-server-build" --repo ${{ github.repository }} || true
          brew install --cask unity-hub
          /Applications/Unity\ Hub.app/Contents/MacOS/Unity\ Hub -- \
            --headless install \
            --version ${{ vars.UNITY_VERSION }} \
            --changeset ${{ vars.UNITY_CHANGESET }} \
            --architecture arm64 \
            --module windows-mono \
            --module linux-server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import certificate into keychain
        if: matrix.mode == 'Client'
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          MACOS_CI_KEYCHAIN_RANDOM_PWD: ${{ secrets.MACOS_CI_KEYCHAIN_RANDOM_PWD }}
        run: |
          echo $MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_CI_KEYCHAIN_RANDOM_PWD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_RANDOM_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_RANDOM_PWD" build.keychain

      - name: Activate Unity license
        run: |
          $UNITY_PATH -batchmode -quit -nographics \
            -logFile /tmp/activation.log \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" || true
          cat /tmp/activation.log || true
        env:
          UNITY_PATH: /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}/Unity.app/Contents/MacOS/Unity
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Restore Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: library-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            library-${{ matrix.target }}-

      - name: Build (Unity)
        run: |
          LOG_FILE="$(mktemp /tmp/unity-build.XXXXXX.log)"
          tail -f "$LOG_FILE" &
          TAIL_PID=$!

          GRAPHICS_FLAG=""
          if [ "${{ matrix.mode }}" = "Server" ]; then
            GRAPHICS_FLAG="-nographics"
          fi

          CONFIG=${{ matrix.client_config }}

          $UNITY_PATH -batchmode -quit $GRAPHICS_FLAG \
            -logFile "$LOG_FILE" \
            -projectPath . \
            -buildTarget ${{ matrix.target }} \
            -executeMethod Resonance.BuildTools.BuildScript.BuildCLI \
            -buildMode ${{ matrix.mode }} \
            -buildConfig $CONFIG \
            -buildPlatform ${{ matrix.target }} \
            -serverVersion ${{ needs.generate-server-version.outputs.server_version }}
          BUILD_EXIT=$?

          sleep 1
          kill $TAIL_PID 2>/dev/null || true
          echo "=== Final log entries ==="
          tail -100 "$LOG_FILE"
          exit $BUILD_EXIT
        env:
          UNITY_PATH: /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}/Unity.app/Contents/MacOS/Unity
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Zip
        run: |
          CONFIG=${{ matrix.client_config }}
          if [ "${{ matrix.target }}" = "osxuniversal" ]; then
            ditto -c -k --keepParent "Builds/$CONFIG/Mac/Resonance.app" "Resonance_mac_${CONFIG}.zip"
            echo "ARTIFACT=Resonance_mac_${CONFIG}.zip" >> $GITHUB_ENV
          elif [ "${{ matrix.target }}" = "win64" ]; then
            cd "Builds/$CONFIG/Windows" && zip -r "../../../Resonance_win_${CONFIG}.zip" .
            echo "ARTIFACT=Resonance_win_${CONFIG}.zip" >> $GITHUB_ENV
          else
            cd "Builds/$CONFIG/Linux" && zip -r "../../../ResonanceServer_linux.zip" .
            echo "ARTIFACT=ResonanceServer_linux.zip" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}-${{ matrix.client_config }}
          path: ${{ env.ARTIFACT }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true

      - name: Create GitHub Release
        run: |
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            Resonance_win_ProductionClient.zip \
            Resonance_mac_ProductionClient.zip \
            ResonanceServer_linux.zip \
            --repo ${{ github.repository }} \
            --title "Build $TAG" \
            --notes "Automated production build: client (win64, macOS) + server (linux64)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  edgegap-create-version:
    needs: [ build, generate-server-version ]
    steps:
      - name: Checkout without LFS
        uses: actions/checkout@v4

      - name: Create blank build directory
        run: mkdir -p Builds/Default/Linux

      - name: Download the build artifact
        id: download-server-build
        uses: actions/download-artifact@v4
        with:
          name: build-linux64-Default

      - name: Unzip the downloaded artifact
        run: |
          unzip ${{ steps.download-server-build.outputs.path }} 
          unzip ResonanceServer_linux.zip -d Builds/Default/Linux

      - name: Log into Edgegap container registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.EDGEGAP_CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.EDGEGAP_CONTAINER_REGISTRY_PASSWORD }}
          registry: registry.edgegap.com

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: registry.edgegap.com/${{ vars.EDGEGAP_REGISTRY_PROJECT_NAME }}/${{ needs.generate-server-version.outputs.server_version }}:latest

      - name: Create new Edgegap version
        # See https://docs.edgegap.com/docs/api/versioning#post-v1-app-app_name-version
        run: |
          curl -L \
            --request POST \
            --url 'https://api.edgegap.com/v1/app/${{ vars.EDGEGAP_APP_NAME }}/version' \
            --header 'Authorization: ${{ secrets.EDGEGAP_API_KEY }}' \
            --header 'Content-Type: application/json' \
            --data '{
            "name": "${{ needs.generate-server-version.outputs.server_version }}",
            "req_cpu": 1024,
            "req_memory": 2048,
            "docker_repository": "registry.edgegap.com",
            "private_username": "${{ secrets.EDGEGAP_CONTAINER_REGISTRY_USERNAME }}",
            "private_token": "${{ secrets.EDGEGAP_CONTAINER_REGISTRY_PASSWORD }}",
            "docker_image": "${{ vars.EDGEGAP_REGISTRY_PROJECT_NAME }}/${{ needs.generate-server-version.outputs.server_version }}",
            "docker_tag": "latest",
            "ports": [
              {
                "port": 7777,
                "protocol": "UDP",
                "to_check": false,
                "name": "gameport"
              }
            ],
            "restart_policy": "never"
          }'
