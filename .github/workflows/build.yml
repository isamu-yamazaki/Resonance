name: Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      client_config:
        description: "Client config asset name (DevClient, DevClientLocalRelay, DevHost, DevHostLocalRelay, ProductionClient, ProductionHost)"
        required: true
        default: ProductionHost
      server_config:
        description: "Server config asset name (LocalRelay, Production)"
        required: true
        default: Production

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          elif git log --since="24 hours ago" --oneline | grep -q .; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  test:
    needs: check
    if: needs.check.outputs.has_changes == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Unity installation from cache
        id: cache-unity
        uses: actions/cache/restore@v4
        with:
          path: /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}
          key: unity-${{ vars.UNITY_VERSION }}-full

      - name: Install Unity
        if: steps.cache-unity.outputs.cache-hit != 'true'
        run: |
          brew install --cask unity-hub
          /Applications/Unity\ Hub.app/Contents/MacOS/Unity\ Hub -- \
            --headless install \
            --version ${{ vars.UNITY_VERSION }} \
            --changeset ${{ vars.UNITY_CHANGESET }} \
            --architecture arm64 \
            --module windows-mono \
            --module linux-server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Unity installation to cache
        if: steps.cache-unity.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}
          key: unity-${{ vars.UNITY_VERSION }}-full

      - name: Activate Unity license
        run: |
          $UNITY_PATH -batchmode -quit -nographics \
            -logFile /tmp/activation.log \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" || true
          cat /tmp/activation.log || true
        env:
          UNITY_PATH: /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}/Unity.app/Contents/MacOS/Unity
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Run EditMode tests
        run: |
          LOG_FILE="$(mktemp /tmp/unity-test.XXXXXX.log)"
          tail -f "$LOG_FILE" &
          TAIL_PID=$!

          $UNITY_PATH -batchmode -nographics \
            -logFile "$LOG_FILE" \
            -projectPath . \
            -runTests \
            -testPlatform EditMode \
            -testResults TestResults-EditMode.xml
          TEST_EXIT=$?

          sleep 1
          kill $TAIL_PID 2>/dev/null || true
          echo "=== Final log entries ==="
          tail -100 "$LOG_FILE"
          exit $TEST_EXIT
        env:
          UNITY_PATH: /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}/Unity.app/Contents/MacOS/Unity

      - name: Run PlayMode tests
        run: |
          LOG_FILE="$(mktemp /tmp/unity-test.XXXXXX.log)"
          tail -f "$LOG_FILE" &
          TAIL_PID=$!

          $UNITY_PATH -batchmode \
            -logFile "$LOG_FILE" \
            -projectPath . \
            -runTests \
            -testPlatform PlayMode \
            -testResults TestResults-PlayMode.xml
          TEST_EXIT=$?

          sleep 1
          kill $TAIL_PID 2>/dev/null || true
          echo "=== Final log entries ==="
          tail -100 "$LOG_FILE"
          exit $TEST_EXIT
        env:
          UNITY_PATH: /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}/Unity.app/Contents/MacOS/Unity

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults-*.xml

  build:
    needs: [check, test]
    if: needs.check.outputs.has_changes == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - target: win64
            mode: Client
          - target: osxuniversal
            mode: Client
          - target: linux64
            mode: Server
    steps:
      - uses: actions/checkout@v4

      - name: Restore Unity installation from cache
        id: cache-unity
        uses: actions/cache/restore@v4
        with:
          path: /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}
          key: unity-${{ vars.UNITY_VERSION }}-full

      - name: Install Unity
        if: steps.cache-unity.outputs.cache-hit != 'true'
        run: |
          gh cache delete "unity-${{ vars.UNITY_VERSION }}" --repo ${{ github.repository }} || true
          gh cache delete "unity-${{ vars.UNITY_VERSION }}-server-build" --repo ${{ github.repository }} || true
          brew install --cask unity-hub
          /Applications/Unity\ Hub.app/Contents/MacOS/Unity\ Hub -- \
            --headless install \
            --version ${{ vars.UNITY_VERSION }} \
            --changeset ${{ vars.UNITY_CHANGESET }} \
            --architecture arm64 \
            --module windows-mono \
            --module linux-server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Unity installation to cache
        if: steps.cache-unity.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}
          key: unity-${{ vars.UNITY_VERSION }}-full

      - name: Import certificate into keychain
        if: matrix.mode == 'Client'
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          MACOS_CI_KEYCHAIN_RANDOM_PWD: ${{ secrets.MACOS_CI_KEYCHAIN_RANDOM_PWD }}
        run: |
          echo $MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_CI_KEYCHAIN_RANDOM_PWD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_RANDOM_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_RANDOM_PWD" build.keychain

      - name: Activate Unity license
        run: |
          $UNITY_PATH -batchmode -quit -nographics \
            -logFile /tmp/activation.log \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" || true
          cat /tmp/activation.log || true
        env:
          UNITY_PATH: /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}/Unity.app/Contents/MacOS/Unity
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Determine config
        id: config
        run: |
          if [ "${{ matrix.mode }}" = "Server" ]; then
            echo "value=${{ github.event.inputs.server_config || 'Production' }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.event.inputs.client_config || 'ProductionHost' }}" >> $GITHUB_OUTPUT
          fi

      - name: Build (Unity)
        run: |
          LOG_FILE="$(mktemp /tmp/unity-build.XXXXXX.log)"
          tail -f "$LOG_FILE" &
          TAIL_PID=$!

          GRAPHICS_FLAG=""
          if [ "${{ matrix.mode }}" = "Server" ]; then
            GRAPHICS_FLAG="-nographics"
          fi

          $UNITY_PATH -batchmode -quit $GRAPHICS_FLAG \
            -logFile "$LOG_FILE" \
            -projectPath . \
            -buildTarget ${{ matrix.target }} \
            -executeMethod Resonance.BuildTools.BuildScript.BuildCLI \
            -buildMode ${{ matrix.mode }} \
            -buildConfig ${{ steps.config.outputs.value }} \
            -buildPlatform ${{ matrix.target }}
          BUILD_EXIT=$?

          sleep 1
          kill $TAIL_PID 2>/dev/null || true
          echo "=== Final log entries ==="
          tail -100 "$LOG_FILE"
          exit $BUILD_EXIT
        env:
          UNITY_PATH: /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}/Unity.app/Contents/MacOS/Unity
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Zip
        run: |
          CONFIG=${{ steps.config.outputs.value }}
          if [ "${{ matrix.target }}" = "osxuniversal" ]; then
            ditto -c -k --keepParent "Builds/$CONFIG/Mac/Resonance.app" "Resonance_mac.zip"
            echo "ARTIFACT=Resonance_mac.zip" >> $GITHUB_ENV
          elif [ "${{ matrix.target }}" = "win64" ]; then
            cd "Builds/$CONFIG/Windows" && zip -r "../../../Resonance_win.zip" .
            echo "ARTIFACT=Resonance_win.zip" >> $GITHUB_ENV
          else
            cd "Builds/$CONFIG/Linux" && zip -r "../../../ResonanceServer_linux.zip" .
            echo "ARTIFACT=ResonanceServer_linux.zip" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: ${{ env.ARTIFACT }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true

      - name: Create GitHub Release
        run: |
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            Resonance_win.zip \
            Resonance_mac.zip \
            ResonanceServer_linux.zip \
            --repo ${{ github.repository }} \
            --title "Build $TAG" \
            --notes "Automated build: client (win64, macOS) + server (linux64)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
