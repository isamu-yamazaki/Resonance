name: Server Build

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Server config asset name (LocalRelay or Production)"
        required: true
        default: LocalRelay

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore Unity installation from cache
        id: cache-unity
        uses: actions/cache/restore@v4
        with:
          path: /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}
          key: unity-${{ vars.UNITY_VERSION }}-server-build

      - name: Install Unity
        if: steps.cache-unity.outputs.cache-hit != 'true'
        run: |
          brew install --cask unity-hub
          /Applications/Unity\ Hub.app/Contents/MacOS/Unity\ Hub -- \
            --headless install \
            --version ${{ vars.UNITY_VERSION }} \
            --changeset ${{ vars.UNITY_CHANGESET }} \
            --architecture arm64 \
            --module linux-server

      - name: Save Unity installation to cache
        if: steps.cache-unity.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}
          key: unity-${{ vars.UNITY_VERSION }}-server-build

      - name: Activate Unity license
        run: |
          $UNITY_PATH -batchmode -quit -nographics \
            -logFile /tmp/activation.log \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" || true
          cat /tmp/activation.log || true
        env:
          UNITY_PATH: /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}/Unity.app/Contents/MacOS/Unity
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Build (Unity)
        run: |
          LOG_FILE="$(mktemp /tmp/unity-build.XXXXXX.log)"
          tail -f "$LOG_FILE" &
          TAIL_PID=$!

          $UNITY_PATH -batchmode -quit \
            -logFile "$LOG_FILE" \
            -projectPath . \
            -buildTarget linux64 \
            -executeMethod Resonance.BuildTools.BuildScript.BuildCLI \
            -buildMode Server \
            -buildConfig ${{ github.event.inputs.config || 'LocalRelay' }} \
            -buildPlatform linux64
          BUILD_EXIT=$?

          sleep 1
          kill $TAIL_PID 2>/dev/null || true
          exit $BUILD_EXIT
        env:
          UNITY_PATH: /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}/Unity.app/Contents/MacOS/Unity

      - name: Zip
        run: |
          CONFIG=${{ github.event.inputs.config || 'LocalRelay' }}
          cd "Builds/$CONFIG/Linux" && zip -r "../../../ResonanceServer_linux.zip" .
          echo "ARTIFACT=ResonanceServer_linux.zip" >> $GITHUB_ENV

      - name: Upload to GitHub Releases
        run: |
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$ARTIFACT" \
            --title "Server Build $TAG (${{ github.event.inputs.config || 'LocalRelay' }} / Linux64)" \
            --notes "Automated server build via GitHub Actions"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
